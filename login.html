<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
    <link rel="shortcut icon" href="/icon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
    <link rel="manifest" href="/icon/site.webmanifest" />
    <meta name="theme-color" content="#f4eee6" />
    <title>Admin access · MangaCave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand" href="index.html"><span class="brand-mark">M</span><span>MangaCave</span></a>
      <section class="auth-panel">
        <p class="eyebrow" id="authEyebrow">Shared workspace</p>
        <h1 id="authTitle">Sign in<span>.</span></h1>
        <p id="authDescription">Sign in to read the manga shelf. Administrators can also add manga.</p>
        <form id="authForm" class="auth-form">
          <label>Username<input id="username" name="username" autocomplete="username" required /></label>
          <label>Password<input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required /></label>
          <label id="confirmPasswordField" hidden style="display: none;">Confirm password<input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" /></label>
          <button class="button button-dark" id="authSubmit" type="submit">Sign in</button>
          <p class="auth-status" id="authStatus" role="status"></p>
        </form>
        <p class="auth-note" id="authNote">New here? <button class="text-button" id="switchMode" type="button">Create an account</button></p>
        <a class="text-link" href="index.html">← Back to public journal</a>
      </section>
    </main>
    <script src="brand.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>
  </body>
</html>
